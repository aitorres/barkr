on:
  [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ '3.10', '3.11', '3.12', '3.13', '3.14' ]
    name: Run checks in Python ${{ matrix.python-version }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      - name: Install dependencies with Poetry
        run: poetry install --no-interaction --no-root
      - name: Check types with mypy
        run: poetry run mypy barkr
      - name: Lint code with pylint and flake8
        run: |
          poetry run pylint barkr
          poetry run flake8 --extend-exclude ".venv"
      - name: Run tests with pytest
        run: poetry run pytest --cov=barkr --cov-fail-under=85 --cov-report=term-missing -vvv
