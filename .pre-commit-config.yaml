repos:
  - repo: local
    hooks:
      - id: golangci-lint
        name: golangci-lint
        # Pass only the staged Go files so linting applies to the changes being
        # committed, not to other (e.g. untracked) files in the same package.
        entry: golangci-lint run
        language: golang
        additional_dependencies:
          - github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
        types: [go]
        pass_filenames: true
        require_serial: true
      - id: isort
        name: Sort imports with isort
        entry: cd python && poetry run isort
        language: system
        types: [python]
      - id: black
        name: Apply black formatting
        entry: cd python && poetry run black
        language: system
        types: [python]
      - id: flake8
        name: Check style with flake8
        entry: cd python && poetry run flake8
        language: system
        types: [python]
      - id: pylint
        name: Lint with Pylint
        entry: cd python && poetry run pylint
        language: system
        types: [python]
        args: [ "-rn", "-sn" ]
      - id: mypy
        name: Check types with mypy
        entry: cd python && poetry run mypy
        language: system
        types: [python]
