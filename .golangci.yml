version: "2"

run:
  tests: true

linters:
  enable:
    - errorlint
    - gocritic
    - misspell
    - revive
    - unconvert
    - unparam
    - usestdlibvars

  settings:
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: error-strings
        - name: receiver-naming

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - unparam

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/aitorres/barkr
